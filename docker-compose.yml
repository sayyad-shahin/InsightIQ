# ============================================================================
# OPTIONAL deployment artifact. This project runs natively on Windows without
# Docker/WSL — see NATIVE-SETUP.md and scripts/*.ps1 (that is the default path).
# This compose file is kept only for deploying to a Docker-capable host (e.g. a
# Linux server/CI). It is NOT required to run the application.
# ============================================================================
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightiq}
      POSTGRES_DB: ${POSTGRES_DB:-insightiq}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["api"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-insightiq}:${POSTGRES_PASSWORD:-insightiq}@postgres:5432/${POSTGRES_DB:-insightiq}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/3
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["worker"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-insightiq}:${POSTGRES_PASSWORD:-insightiq}@postgres:5432/${POSTGRES_DB:-insightiq}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    # The worker runs no HTTP server, so it must NOT use the image's default
    # curl-based healthcheck. Ping the worker over the broker instead.
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  storage:
