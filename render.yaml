# ============================================================================
# InsightIQ — Render Blueprint (https://render.com/docs/blueprint-spec)
#
# Deploy: push to GitHub -> Render Dashboard -> New -> Blueprint -> pick this
# repo -> Apply. Render creates the database, Redis, API, and frontend and wires
# the env vars automatically.
#
# NOTE ON THE CELERY WORKER: Render Background Workers require a PAID plan. This
# blueprint runs on the FREE tier by processing background jobs INLINE
# (CELERY_TASK_ALWAYS_EAGER=true on the API). To use a real worker instead,
# uncomment the `insightiq-worker` block at the bottom AND set
# CELERY_TASK_ALWAYS_EAGER=false on the API service.
# ============================================================================

databases:
  - name: insightiq-db
    databaseName: insightiq
    user: insightiq
    plan: free
    region: singapore

services:
  # --- Redis / Key Value (cache, rate-limit, and Celery broker/results) ---
  - type: redis
    name: insightiq-redis
    plan: free
    region: singapore
    ipAllowList: [] # empty = internal-only (reachable by the other Render services)
    maxmemoryPolicy: noeviction # safe for a Celery broker (don't drop queued jobs)

  # --- Backend API (FastAPI) ---
  - type: web
    name: insightiq-api
    runtime: python
    region: singapore
    plan: free
    rootDir: .
    buildCommand: "pip install -r requirements.txt"
    # Apply DB migrations, then serve. gunicorn+uvicorn workers on $PORT.
    startCommand: "alembic upgrade head && gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      # Auto-generated strong secret (Render fills this in once).
      - key: SECRET_KEY
        generateValue: true
      # Wired automatically from the managed database + Redis.
      - key: DATABASE_URL
        fromDatabase:
          name: insightiq-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: insightiq-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: insightiq-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: insightiq-redis
          property: connectionString
      - key: RATE_LIMIT_STORAGE_URI
        fromService:
          type: redis
          name: insightiq-redis
          property: connectionString
      # FREE tier: run jobs inline (no paid worker). Set to "false" if you enable
      # the insightiq-worker service below.
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      # Frontend & API are on different *.onrender.com domains -> cross-site cookies.
      - key: COOKIE_SAMESITE
        value: none
      - key: CORS_ORIGINS
        value: https://insightiq-frontend.onrender.com
      - key: FRONTEND_URL
        value: https://insightiq-frontend.onrender.com
      # Optional AI chat (leave blank to run without it):
      - key: GOOGLE_API_KEY
        sync: false

  # --- Frontend (React / Vite) as a static site ---
  - type: web
    name: insightiq-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    envVars:
      # Absolute backend origin, baked into the build (see src/lib/api.ts).
      - key: VITE_API_URL
        value: https://insightiq-api.onrender.com
    routes:
      # SPA fallback: serve index.html for client-side routes.
      - type: rewrite
        source: /*
        destination: /index.html

  # --- Celery worker (OPTIONAL — requires a PAID Render plan) --------------
  # To use a real background worker instead of inline processing:
  #   1) Uncomment this whole block.
  #   2) Change CELERY_TASK_ALWAYS_EAGER to "false" on insightiq-api above.
  #
  # - type: worker
  #   name: insightiq-worker
  #   runtime: python
  #   region: singapore
  #   plan: starter
  #   rootDir: .
  #   buildCommand: "pip install -r requirements.txt"
  #   startCommand: "celery -A app.workers.celery_app.celery_app worker --loglevel=info"
  #   envVars:
  #     - key: PYTHON_VERSION
  #       value: "3.11.9"
  #     - key: APP_ENV
  #       value: production
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: insightiq-db
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         type: redis
  #         name: insightiq-redis
  #         property: connectionString
  #     - key: CELERY_BROKER_URL
  #       fromService:
  #         type: redis
  #         name: insightiq-redis
  #         property: connectionString
  #     - key: CELERY_RESULT_BACKEND
  #       fromService:
  #         type: redis
  #         name: insightiq-redis
  #         property: connectionString
